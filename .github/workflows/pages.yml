name: Publish Ali Abi and Zoyo
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install and build React gallery
        run: |
          npm ci
          npm run build:slider
          npm run typecheck
      - name: Read GitHub Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - name: Render real canonical URLs and sitemap
        run: python3 scripts/build.py
      - name: Verify pages and JavaScript
        run: |
          python3 scripts/check.py
          python3 scripts/check-seo.py
          node --check assets/js/main.js
          node --check assets/js/image-auto-slider.js
      - name: Export public files
        run: python3 scripts/export.py
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
